[package]
name = "academic-translator"
version = "0.1.0"
description = "A local-first academic PDF translation reader"
authors = ["Academic Translator Contributors"]
edition = "2021"

[lib]
name = "academic_translator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "academic-translator"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "^2", features = [] }

[dependencies]
async-trait = "0.1.92"
hex = "0.4.3"
keyring = "4.2.0"
jsonschema = "0.52.1"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "rustls"] }
rusqlite = { version = "0.38.0", features = ["bundled"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tauri = { version = "^2", features = [] }
tauri-plugin-dialog = "^2"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.19"
unicode-segmentation = "1.13.3"
uuid = { version = "1.26.0", features = ["v4", "serde"] }
zeroize = "1.9.0"

[dev-dependencies]
rstest = "0.26.1"
tempfile = "3.23.0"
wiremock = "0.6.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }
