[package]
name = "academic-translator"
version = "0.1.0"
description = "A local-first academic PDF translation reader"
authors = ["Academic Translator Contributors"]
edition = "2021"

[lib]
name = "academic_translator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "academic-translator"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "^2", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "^2", features = [] }
thiserror = "2.0.20"
